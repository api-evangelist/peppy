aid: peppy
name: Peppy
description: >-
  Peppy is a global employee healthcare benefits platform, delivered through a
  mobile app, that connects workers with specialist clinicians across key life
  stages. Offered by employers as a benefit, Peppy provides unlimited access to
  practitioners covering women's health, men's health, fertility, pregnancy and
  early parenthood, menopause, and neurodiversity, alongside lifestyle support
  for nutrition, fitness, and mental wellbeing. Peppy operates a consumer and
  employer facing service and does not publish a public developer API; this
  profile captures its published web properties and security posture. Peppy is a
  Seedcamp portfolio company.
